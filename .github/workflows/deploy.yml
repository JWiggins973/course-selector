name: Deploy to GitHub Pages

on:
  push:
    branches:
      - enhancements

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: course-planner
        run: npm install

      - name: Build
        working-directory: course-planner
        run: npx ng build --base-href /course-selector/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: course-planner/dist/course-planner/browser
